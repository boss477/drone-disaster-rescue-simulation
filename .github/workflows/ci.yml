name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: >
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu
          -r requirements-demo.txt -r requirements-mavlink.txt
      - name: Unit tests
        run: python -m unittest discover -s tests

  node:
    name: node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Route math tests
        run: node --test tests/city_route_math.test.mjs
