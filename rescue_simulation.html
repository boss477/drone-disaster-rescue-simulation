<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flood Rescue • 3D Mission Simulation</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07131f;color:#dff7ff;font:14px Segoe UI,system-ui,sans-serif}#hud{position:fixed;z-index:2;left:18px;top:18px;width:270px;padding:16px;border:1px solid #2b7188;border-radius:14px;background:#07131fcc;backdrop-filter:blur(8px);box-shadow:0 12px 35px #0008}h1{font-size:18px;margin:0 0 8px;color:#7de7ff}.tag{color:#ffc857;font-size:11px;letter-spacing:1px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}.stat{background:#102838;padding:8px;border-radius:8px}.stat b{display:block;font-size:20px;color:#fff}.stat small{color:#8db4c0}button{border:0;border-radius:8px;padding:9px 12px;margin-right:5px;background:#1ac7a2;color:#03211e;font-weight:700;cursor:pointer}button.secondary{background:#25465b;color:#dff7ff}#status{margin-top:12px;line-height:1.4;color:#b9d9e2}#hint{position:fixed;right:18px;bottom:16px;color:#9bc7d1;background:#07131faa;padding:8px 12px;border-radius:8px}
</style></head><body><div id="hud"><div class="tag">SIMULATED TRAINING SCENARIO</div><h1>FLOOD RESCUE / DRONE 01</h1><div class="stats"><div class="stat"><b id="detected">0</b><small>people detected</small></div><div class="stat"><b id="helped">0</b><small>people helped</small></div><div class="stat"><b id="loaded">6</b><small>packages loaded</small></div><div class="stat"><b id="delivered">0</b><small>packages delivered</small></div></div><button id="start">Start mission</button><button class="secondary" id="reset">Reset</button><div id="status">Drone ready at base. Mission speed: slow.</div></div><div id="hint">Drag to orbit • wheel to zoom</div>
<script type="module">
import * as THREE from './vendor/three.module.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07131f); scene.fog=new THREE.Fog(0x07131f,35,85);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,200); camera.position.set(20,18,24);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);
const controls={update(){},target:new THREE.Vector3()};
let dragging=false,lastX=0,lastY=0; renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY}); addEventListener('pointerup',()=>dragging=false); addEventListener('pointermove',e=>{if(!dragging)return; camera.position.x-= (e.clientX-lastX)*.035; camera.position.y+=(e.clientY-lastY)*.035; camera.lookAt(0,0,0); lastX=e.clientX;lastY=e.clientY}); renderer.domElement.addEventListener('wheel',e=>{camera.position.multiplyScalar(e.deltaY>0?1.06:.94);camera.lookAt(0,0,0)});
scene.add(new THREE.HemisphereLight(0x9fe7ff,0x183044,2)); const sun=new THREE.DirectionalLight(0xffe4b0,2.2);sun.position.set(-12,25,8);scene.add(sun);
const mat=(c,rough=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
const water=new THREE.Mesh(new THREE.BoxGeometry(50,.55,40),mat(0x12617b,.25));water.position.y=-.5;scene.add(water);
const ground=new THREE.Mesh(new THREE.BoxGeometry(48,.5,38),mat(0x243d42));ground.position.y=-.85;scene.add(ground);
for(let x=-18;x<=18;x+=6)for(let z=-14;z<=14;z+=7){const h=2+((x*x+z*z)%5);const b=new THREE.Mesh(new THREE.BoxGeometry(4,h,4),mat((x+z)%2?0x9b6b52:0x536477));b.position.set(x,-.6+h/2,z);scene.add(b);for(let y=0;y<h;y+=1.3){const w=new THREE.Mesh(new THREE.BoxGeometry(.5,.35,.06),mat(0xffd66e));w.position.set(x-1.2,-.45+y,z-2.03);scene.add(w)}}
const people=[]; const targets=[new THREE.Vector3(-12,4,-8),new THREE.Vector3(6,3,-7),new THREE.Vector3(13,5,7),new THREE.Vector3(-7,2,9)];
function person(p){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CylinderGeometry(.22,.3,.65,8),mat(0xffb13b));body.position.y=.35;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.25,12,8),mat(0xf0c49a));head.position.y=.85;g.add(head);g.position.copy(p);scene.add(g);people.push(g)} targets.forEach(person);
const drone=new THREE.Group(); const core=new THREE.Mesh(new THREE.BoxGeometry(1.7,.35,1.05),mat(0xe9f3f5));drone.add(core);const arm=mat(0x172b38);for(const s of [-1,1])for(const t of [-1,1]){const bar=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,2.1,8),arm);bar.rotation.z=Math.PI/2;bar.position.set(s*.9,.1,t*.65);drone.add(bar);const prop=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,1.2,8),mat(0x53d7e8));prop.rotation.x=Math.PI/2;prop.position.set(s*1.35,.28,t*.65);drone.add(prop)}drone.position.set(0,5,14);scene.add(drone);
const base=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,.2,32),mat(0x16b89a));base.position.set(0,-.45,14);scene.add(base);const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(targets.flatMap((p,i)=>[p,targets[(i+1)%targets.length]])),new THREE.LineBasicMaterial({color:0x4bd5e7,transparent:true,opacity:.35}));scene.add(line);
let running=false,progress=0,delivered=0,detected=0; const status=document.querySelector('#status');
function update(){const leg=Math.min(3,Math.floor(progress));const t=(progress%1);const from=leg?targets[leg-1]:new THREE.Vector3(0,5,14),to=leg<4?targets[leg%4]:new THREE.Vector3(0,5,14);drone.position.lerpVectors(from,to,t);drone.position.y=(leg?to.y+2:5)+Math.sin(progress*8)*.18; if(leg<4&&t>.55&&detected<leg+1){detected=leg+1;delivered=leg+1;document.querySelector('#detected').textContent=detected;document.querySelector('#helped').textContent=delivered;document.querySelector('#delivered').textContent=delivered;document.querySelector('#loaded').textContent=6-delivered;status.textContent=`Package ${delivered} unloaded at rescue point ${delivered}. ${detected} people detected.`} if(progress>=4){running=false;status.textContent='Mission complete. Drone returned to base and logged 4 simulated deliveries.'}}
function loop(){requestAnimationFrame(loop);if(running){progress+=.0025;update()}controls.update();renderer.render(scene,camera)}loop();
document.querySelector('#start').onclick=()=>{running=true;status.textContent='Drone lifting slowly from base…'};document.querySelector('#reset').onclick=()=>{progress=0;delivered=detected=0;running=false;drone.position.set(0,5,14);['detected','helped','delivered'].forEach(id=>document.querySelector('#'+id).textContent='0');document.querySelector('#loaded').textContent='6';status.textContent='Drone ready at base. Mission speed: slow.'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
